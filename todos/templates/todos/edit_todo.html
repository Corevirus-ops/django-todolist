<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django app Todo Edit todo</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Edit Todo</h1>
    <form method="POST" action="{% url 'edit_todo' todo.id %}">
        {% csrf_token %}
        <label for="title" class="form-label">Title:</label>
        <input type="text" id="title" name="title" value="{{ todo.title }}" class="form-control" required><br><br>
        <label for="description" class="form-label">Description:</label>
        <textarea id="description" name="description" class="form-control" required>{{ todo.description }}</textarea><br><br>
        <div class="form-check mt-3">
            <input type="checkbox" {% if todo.completed %} checked {% endif %} name="completed" class="form-check-input"> Completed<br><br>
        </div>
        <button type="submit" class="btn btn-primary">Update Todo</button>
    </form>
    </div>  
</body>
</html>
